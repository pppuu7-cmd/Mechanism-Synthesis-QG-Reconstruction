name: Iter038 Full K5 Carrier S5 Covariance

on:
  push:
    branches: [main]
    paths:
      - 'vertex/full_k5_permutation_covariance.py'
      - '.github/workflows/iter038-full-carrier-s5-covariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-carrier-covariance:
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [83,149]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'mpmath==1.3.0' 'sympy==1.14.0' 'numpy==2.1.3'
      - name: Test full boundary-contracted causal carrier under even and odd S5 relabelings
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/full_k5_permutation_covariance.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/iter038_covariance_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter038-covariance-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: error
          retention-days: 30
