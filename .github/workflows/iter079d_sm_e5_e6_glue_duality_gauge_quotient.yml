name: Iter079D-SM E5/E6 glue duality gauge quotient

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER079D_SM_E5_E6_GLUE_DUALITY_GAUGE_QUOTIENT.md'
      - 'distributional/iter079d_sm_e5_e6_glue_duality_gauge_quotient.py'
      - '.github/workflows/iter079d_sm_e5_e6_glue_duality_gauge_quotient.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter079D-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen lane
        run: |
          mkdir -p out
          python distributional/iter079d_sm_e5_e6_glue_duality_gauge_quotient.py --lane '${{ matrix.lane }}' --output 'out/iter079d_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079d-sm-${{ matrix.lane }}
          path: out/iter079d_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter079D-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter079d-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        run: |
          mkdir -p out
          python distributional/iter079d_sm_e5_e6_glue_duality_gauge_quotient.py --aggregate-dir downloaded --output out/iter079d_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079d-sm-aggregate
          path: out/iter079d_sm_aggregate.json
          if-no-files-found: error
