name: MSQGR Parallel Research

on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - "data/**"
      - "bridges/**"
      - ".github/workflows/msqgr-parallel-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: architecture-synthesis
            command: "mkdir -p results && python code/synthesize_candidates.py | tee results/synthesis.txt"
            artifact: architecture
          - name: naive-causal-character-scan
            command: "python code/causal_character_scan.py"
            artifact: causal-character
          - name: exact-constraint-rank
            command: "python code/constraint_rank.py"
            artifact: constraint-rank
          - name: transfer-negative-control
            command: "python code/transfer_semigroup_test.py"
            artifact: transfer-control
          - name: causal-analytic-rg-pole-control
            command: "python code/toller_rg_closure_toy.py --trials 256"
            artifact: toller-rg-control
          - name: causal-rg-commutator
            command: "python code/causal_rg_commutator.py"
            artifact: causal-rg-commutator
          - name: causal-cylindrical-intertwining
            command: "python code/causal_embedding_consistency.py"
            artifact: causal-cylindrical-intertwining
          - name: carc-multiscale-scan
            command: "python code/carc_multiscale_scan.py --trials 400 --steps 16"
            artifact: carc-multiscale
          - name: carc-codimension
            command: "python code/carc_codimension.py"
            artifact: carc-codimension
          - name: gamma-simple-toller-pole-closure
            command: "python code/gamma_simple_toller_pole_closure.py --max-j2 14 --max-n 8"
            artifact: gamma-simple-pole-closure
          - name: toller-embedding-taxonomy
            command: "python code/toller_embedding_taxonomy.py"
            artifact: toller-embedding-taxonomy
          - name: gamma-flow-causal-sector
            command: "python code/gamma_flow_causal_sector.py --steps 4001"
            artifact: gamma-flow-causal-sector
          - name: toller-gamma-simple-reference
            command: "python -m pip install -q mpmath && python code/toller_gamma_simple_reference.py"
            artifact: toller-gamma-simple-reference
          - name: published-eprl-delta4-convergence
            command: "python code/published_eprl_delta4_convergence.py"
            artifact: published-eprl-delta4-convergence
          - name: eprl-cutoff-selector
            command: "python code/eprl_cutoff_selector.py --window 3"
            artifact: eprl-cutoff-selector
          - name: eprl-tail-estimator-validation
            command: "python code/eprl_tail_estimator_validation.py"
            artifact: eprl-tail-estimator-validation
          - name: eprl-tail-model-selection
            command: "python code/eprl_tail_model_selection.py --tail 8"
            artifact: eprl-tail-model-selection
          - name: eprl-power-tail-extrapolation
            command: "python code/eprl_power_tail_extrapolation.py"
            artifact: eprl-power-tail-extrapolation
          - name: eprl-backend-readiness-gate
            command: "python code/eprl_backend_readiness_gate.py"
            artifact: eprl-backend-readiness-gate
          - name: eprl-precision-readiness-gate
            command: "python code/eprl_precision_readiness_gate.py"
            artifact: eprl-precision-readiness-gate
          - name: f9-fail-closed-gate
            command: "python code/f9_gate.py"
            artifact: f9-gate
          - name: novelty-overlap
            command: "python code/novelty_overlap.py"
            artifact: novelty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run research stream
        shell: bash
        run: ${{ matrix.command }}
      - name: Upload stream result
        uses: actions/upload-artifact@v4
        with:
          name: msqgr-${{ matrix.artifact }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate campaign verdict
    needs: stream
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download successful stream artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: msqgr-*
          path: parallel-results
          merge-multiple: true
      - name: Aggregate
        run: python code/aggregate_parallel_results.py --input parallel-results
      - name: Publish combined verdict artifact
        uses: actions/upload-artifact@v4
        with:
          name: msqgr-combined-verdict
          path: combined-results/
          retention-days: 30
