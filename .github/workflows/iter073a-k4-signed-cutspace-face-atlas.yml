name: Iter073A K4 signed cutspace proper-face atlas
on:
  push:
    paths:
      - '.github/workflows/iter073a-k4-signed-cutspace-face-atlas.yml'
      - 'distributional/iter073a_k4_signed_cutspace_face_atlas.py'
      - 'distributional/iter073a_aggregate.py'
      - 'status/ITERATION_073A_PREREG.md'
  workflow_dispatch:
jobs:
  exact-lane:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        sigma: ['++++','+++-','++-+','++--','+-++','+-+-','+--+','+---']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy numpy scipy
      - name: Run exact proper-face lane
        run: |
          mkdir -p out
          python -m distributional.iter073a_k4_signed_cutspace_face_atlas --sigma '${{ matrix.sigma }}' --output 'out/iter073a-${{ matrix.sigma }}.json'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter073a-${{ matrix.sigma }}
          path: out/iter073a-${{ matrix.sigma }}.json
          if-no-files-found: error
  aggregate:
    if: always()
    needs: [exact-lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: iter073a-*
          path: artifacts
      - run: python distributional/iter073a_aggregate.py --input-dir artifacts --output iter073a-aggregate.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter073a-aggregate
          path: iter073a-aggregate.json
          if-no-files-found: error
