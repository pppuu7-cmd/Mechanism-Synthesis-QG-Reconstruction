name: Iter076E source-relative tangent complex

on:
  push:
    paths:
      - '.github/workflows/iter076e_source_relative_tangent_complex.yml'
  workflow_dispatch:

jobs:
  tangent-complex:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen lane ${{ matrix.lane }}
        run: |
          mkdir -p out
          python distributional/iter076e_source_relative_tangent_complex.py --lane '${{ matrix.lane }}' --output 'out/iter076e_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076e-${{ matrix.lane }}
          path: out/iter076e_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: tangent-complex
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076e-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        run: |
          mkdir -p out
          python distributional/iter076e_aggregate.py --input-root downloaded --output out/iter076e_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter076e-aggregate
          path: out/iter076e_aggregate.json
          if-no-files-found: error
