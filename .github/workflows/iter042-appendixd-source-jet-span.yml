name: Iter042 AppendixD Source Jet Span

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k5_appendixd_source_jet_span.py'
      - '.github/workflows/iter042-appendixd-source-jet-span.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-jet-span:
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        degree: [2,4,6,7,8,9,10]
        seed: [17,29]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.1.3'
      - name: Audit source-supported primitive jet span
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python distributional/k5_appendixd_source_jet_span.py \
            --degree "${{ matrix.degree }}" \
            --seed "${{ matrix.seed }}" \
            --samples 160 \
            --output "results/iter042_source_span_d${{ matrix.degree }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter042-source-span-d${{ matrix.degree }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: error
          retention-days: 30
