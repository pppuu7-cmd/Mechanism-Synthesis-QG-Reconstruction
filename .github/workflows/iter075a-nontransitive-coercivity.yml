name: Iter075A nontransitive coercivity

on:
  push:
    branches:
      - research/iter075a-nontransitive-coercivity
  workflow_dispatch:

jobs:
  exact-coercivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy numpy scipy
      - name: Run frozen exact coercivity audit
        run: |
          mkdir -p out
          python -m distributional.iter075a_nontransitive_coercivity --output out/iter075a-aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter075a-aggregate
          path: out/iter075a-aggregate.json
          if-no-files-found: error
          retention-days: 90
