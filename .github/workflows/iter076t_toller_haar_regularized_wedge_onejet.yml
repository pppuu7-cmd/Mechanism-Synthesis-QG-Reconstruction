name: Iter076T Toller-Haar regularized wedge one-jet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076t_toller_haar_regularized_wedge_onejet.yml'
      - 'distributional/iter076t_toller_haar_regularized_wedge_onejet.py'
      - 'prereg/ITER076T_TOLLER_HAAR_REGULARIZED_WEDGE_ONEJET.md'
      - 'sources/CAUSAL_VERTEX_TOLLER_ONEJET_SOURCE_SNAPSHOT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact/numerical dependencies
        run: python -m pip install 'sympy==1.13.3' 'mpmath==1.3.0'
      - name: Run frozen lane ${{ matrix.lane }}
        run: |
          mkdir -p out
          python distributional/iter076t_toller_haar_regularized_wedge_onejet.py --lane '${{ matrix.lane }}' --output 'out/iter076t_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076t-${{ matrix.lane }}
          path: out/iter076t_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact/numerical dependencies
        run: python -m pip install 'sympy==1.13.3' 'mpmath==1.3.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076t-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        run: |
          mkdir -p out
          python distributional/iter076t_toller_haar_regularized_wedge_onejet.py --aggregate-dir downloaded --output out/iter076t_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076t-aggregate
          path: out/iter076t_aggregate.json
          if-no-files-found: error
