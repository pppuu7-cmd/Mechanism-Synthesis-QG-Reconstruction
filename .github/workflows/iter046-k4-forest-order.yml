name: Iter046 K4 Forest Order Consistency

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_forest_order_finite_part.py'
      - 'status/ITERATION_046.md'
      - '.github/workflows/iter046-k4-forest-order.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        case: ['A','B']
        tree: ['S0','S1','P0','P1']
        order: ['012','021','102','120','201','210']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Sequential K4 finite-part lane
        env:
          CASE: ${{ matrix.case }}
          TREE: ${{ matrix.tree }}
          ORDER: ${{ matrix.order }}
        run: |
          mkdir -p results
          if [ "$CASE" = "A" ]; then
            GAMMA='0.83'; EPSILON='0.06'; SIGNS='++++++'; K='0.19,-0.31,0.27,-0.15'
          else
            GAMMA='1.43'; EPSILON='0.12'; SIGNS='-++-++'; K='-0.22,0.37,-0.28,0.13'
          fi
          python distributional/k4_forest_order_finite_part.py \
            --mode compute --case "$CASE" --gamma "$GAMMA" --epsilon "$EPSILON" \
            --signs="$SIGNS" --k="$K" --tree "$TREE" --order "$ORDER" \
            --output "results/iter046_${CASE}_${TREE}_${ORDER}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter046-lane-${{ matrix.case }}-${{ matrix.tree }}-${{ matrix.order }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter046-lane-*
          path: collected
          merge-multiple: true
      - name: Aggregate frozen forest/order gate
        run: |
          mkdir -p results
          python distributional/k4_forest_order_finite_part.py \
            --mode aggregate --input-dir collected \
            --output results/iter046_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter046-aggregate
          path: results/
          if-no-files-found: error
