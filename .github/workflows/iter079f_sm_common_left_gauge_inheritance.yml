name: Iter079F-SM common-left gauge inheritance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER079F_SM_COMMON_LEFT_GAUGE_INHERITANCE.md'
      - 'distributional/iter079f_sm_common_left_gauge_inheritance.py'
      - '.github/workflows/iter079f_sm_common_left_gauge_inheritance.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter079F-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen lane
        run: |
          mkdir -p out
          python distributional/iter079f_sm_common_left_gauge_inheritance.py --lane '${{ matrix.lane }}' --output 'out/iter079f_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079f-sm-${{ matrix.lane }}
          path: out/iter079f_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter079F-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter079f-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        run: |
          mkdir -p out
          python distributional/iter079f_sm_common_left_gauge_inheritance.py --aggregate-dir downloaded --output out/iter079f_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079f-sm-aggregate
          path: out/iter079f_sm_aggregate.json
          if-no-files-found: error
