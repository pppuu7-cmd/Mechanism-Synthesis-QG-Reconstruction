name: Iter079H-SM two-vertex E6 orbit count

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER079H_SM_TWO_VERTEX_E6_ORBIT_COUNT.md'
      - 'distributional/iter079h_sm_two_vertex_e6_orbit_count.py'
      - '.github/workflows/iter079h_sm_two_vertex_e6_orbit_count.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter079H-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen lane
        run: |
          mkdir -p out
          python distributional/iter079h_sm_two_vertex_e6_orbit_count.py --lane '${{ matrix.lane }}' --output 'out/iter079h_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079h-sm-${{ matrix.lane }}
          path: out/iter079h_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter079H-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter079h-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        run: |
          mkdir -p out
          python distributional/iter079h_sm_two_vertex_e6_orbit_count.py --aggregate-dir downloaded --output out/iter079h_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079h-sm-aggregate
          path: out/iter079h_sm_aggregate.json
          if-no-files-found: error
