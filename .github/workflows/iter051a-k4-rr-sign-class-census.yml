name: Iter051A K4 RR Sign-Class Census

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_rr_sign_class_census.py'
      - 'status/ITERATION_051_SIGN_CENSUS.md'
      - '.github/workflows/iter051a-k4-rr-sign-class-census.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 96
      matrix:
        point: ['H1','H2']
        sign_class: ['+++','++-','+-+','+--','-++','-+-','--+','---']
        tree: ['S0','S1','P0','P1']
        pair: ['01','02','12']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact factorized sign-class RR lane
        env:
          POINT: ${{ matrix.point }}
          SIGN_CLASS: ${{ matrix.sign_class }}
          TREE: ${{ matrix.tree }}
          PAIR: ${{ matrix.pair }}
        run: |
          mkdir -p results
          python distributional/k4_rr_sign_class_census.py \
            --mode compute --point "$POINT" --sign-class="$SIGN_CLASS" \
            --tree "$TREE" --pair "$PAIR" \
            --output "results/iter051a_${POINT}_${SIGN_CLASS}_${TREE}_${PAIR}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter051a-${{ matrix.point }}-${{ matrix.sign_class }}-${{ matrix.tree }}-${{ matrix.pair }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter051a-*
          path: collected
          merge-multiple: true
      - name: Aggregate frozen Iter051A gate
        run: |
          mkdir -p results
          python distributional/k4_rr_sign_class_census.py \
            --mode aggregate --input-dir collected \
            --output results/iter051a_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter051a-aggregate
          path: results/
          if-no-files-found: warn
