name: K5 34-orbit component1 support-mixing defect diagnostic
on:
  push:
    paths:
      - '.github/workflows/k5_34_orbit_component1_support_mixing_defect_diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen exact component1 diagnostic
        run: python scripts/k5_34_orbit_component1_support_mixing_defect_diagnostic.py --output results/raw/k5_34_orbit_component1_support_mixing_defect_diagnostic.json
      - name: Upload terminal diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-34-orbit-component1-support-mixing-defect-diagnostic
          path: results/raw/k5_34_orbit_component1_support_mixing_defect_diagnostic.json
          if-no-files-found: error
# frozen production trigger
