name: Iter083G S5 regulator metric nonuniqueness

on:
  push:
    paths:
      - 'prereg/ITER083G_SM_MULTIVARIATE_REGULATOR_METRIC_S5_NONUNIQUENESS.md'
      - 'sources/ITER083G_MULTIVARIATE_RENORMALIZATION_Q_SOURCE_LOCK.md'
      - 'scripts/iter083g_s5_regulator_metric_nonuniqueness.py'
      - '.github/workflows/iter083g_s5_regulator_metric_nonuniqueness.yml'
      - 'results/ITER083B_SM_FILTERED_BOUNDARY_COVARIANT_SUPPORTED_AMBIGUITY_RESULT.md'
      - 'results/ITER083F_SM_COMMON_SPECTRAL_EPSILON_COLLISION_RESULT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run exact Iter083G validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/raw
          python3 scripts/iter083g_s5_regulator_metric_nonuniqueness.py \
            --output results/raw/iter083g_sm_s5_regulator_metric_nonuniqueness.json \
            | tee iter083g_stdout.json
          python3 - <<'PY'
          import json
          p='results/raw/iter083g_sm_s5_regulator_metric_nonuniqueness.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['verdict']=='PASS_EXACT_SCOPED', d
          assert all(d['predicates'].values()), d['predicates']
          assert all(d['controls'].values()), d['controls']
          assert d['s5_permutations_checked']==120
          assert d['edge_dimension']==10
          assert d['symmetric_matrix_variables']==55
          assert d['invariance_constraint_rank']==52
          assert d['invariant_symmetric_form_dimension']==3
          assert d['pair_orbit_sizes']==[10,15,30]
          assert d['representation_decomposition']=='[5] + [4,1] + [3,2]'
          assert d['edge_character']==[10,4,2,1,1,0,0]
          assert d['residual_character_3_2']==[5,1,1,-1,1,-1,0]
          assert d['Q2_eigenvalues']==['8/5','11/10','4/5']
          assert d['Q2_positive_definite'] is True
          assert d['Q2_not_scalar_multiple_of_Q1'] is True
          assert d['frozen_supported_ambiguity_dimension']==377
          print('ITER083G_GATE=PASS_EXACT_SCOPED')
          print('invariant metric dimension=',d['invariant_symmetric_form_dimension'])
          print('pair orbit sizes=',d['pair_orbit_sizes'])
          print('edge representation=',d['representation_decomposition'])
          print('Q2 eigenvalues=',d['Q2_eigenvalues'])
          PY
          sha256sum results/raw/iter083g_sm_s5_regulator_metric_nonuniqueness.json | tee iter083g_sha256.txt
      - name: Upload exact result artifact
        uses: actions/upload-artifact@v4
        with:
          name: iter083g-s5-regulator-metric-nonuniqueness
          path: |
            results/raw/iter083g_sm_s5_regulator_metric_nonuniqueness.json
            iter083g_stdout.json
            iter083g_sha256.txt
          if-no-files-found: error
          retention-days: 90
