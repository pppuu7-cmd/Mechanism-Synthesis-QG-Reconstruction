name: Full Sphere Residue Mean

on:
  push:
    branches: [main]
    paths:
      - 'vertex/full_sphere_residue_mean.py'
      - '.github/workflows/full-sphere-residue-mean.yml'
  workflow_dispatch:

jobs:
  full-sphere:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [131,173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Estimate full-sphere leading residue mean
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/full_sphere_residue_mean.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/full_sphere_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-sphere-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
