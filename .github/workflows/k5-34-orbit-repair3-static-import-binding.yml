name: K5 34-orbit repair3 static import binding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/k5_34_orbit_repair3_static_import_binding_gate.py'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_shard_repair3.py'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_core_repair3_matching_key_frame.py'
      - 'prereg/K5_34_ORBIT_REPAIR3_STATIC_IMPORT_BINDING_GATE.md'
jobs:
  static-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen static/import binding gate
        run: python scripts/k5_34_orbit_repair3_static_import_binding_gate.py
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-34-orbit-repair3-static-import-binding
          path: results/raw/k5_34_orbit_repair3_static_import_binding_gate.json
          if-no-files-found: error
