name: General Toller Residue Kernel

on:
  push:
    branches: [main]
    paths:
      - 'regulated/general_toller_residue_series.py'
      - 'regulated/j_equal_l_residue_series.py'
      - 'regulated/endpoint_precontraction_scan.py'
      - 'regulated/run_with_stable_hyp2f1.py'
      - '.github/workflows/general-residue-kernel.yml'
  workflow_dispatch:

jobs:
  general-residue:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','0.5','1.2','2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install high-precision dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy
      - name: Validate general residue-series kernel
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py regulated/general_toller_residue_series.py \
            --gamma "${{ matrix.gamma }}" \
            --output "results/general_residue_gamma_${{ matrix.gamma }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-residue-gamma-${{ matrix.gamma }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
