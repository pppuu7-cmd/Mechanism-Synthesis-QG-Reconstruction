name: Iter068C Pre-Pullback Distributional EPRL Control

on:
  push:
    branches: [main]
    paths:
      - 'distributional/iter068c_prepullback_eprl_control.py'
      - 'status/ITERATION_068C_PREREG.md'
      - '.github/workflows/iter068c-prepullback-eprl-control.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        gamma: ['0.2','1.2','2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip mpmath
      - name: Run frozen pre-pullback control lane
        run: |
          mkdir -p results
          safe_gamma=$(echo '${{ matrix.gamma }}' | tr '.' '_')
          python distributional/iter068c_prepullback_eprl_control.py \
            --gamma '${{ matrix.gamma }}' --output "results/iter068c_${safe_gamma}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter068c-${{ matrix.gamma }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    runs-on: ubuntu-24.04
    needs: [audit]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter068c-*
          path: gathered
          merge-multiple: true
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json
          from pathlib import Path
          rows=[json.load(open(f,encoding='utf-8')) for f in sorted(glob.glob('gathered/*.json'))]
          valid=(len(rows)==3 and all(r.get('valid') for r in rows))
          passes=sum(r.get('classification')=='ITER068C_PREPULLBACK_DISTRIBUTIONAL_EPRL_CONTROL_PASS' for r in rows)
          reviews=sum(r.get('classification')=='ITER068C_PREPULLBACK_CONTROL_REVIEW' for r in rows)
          if not valid: cls='ITER068C_INVALID'
          elif reviews==0: cls='ITER068C_PREPULLBACK_DISTRIBUTIONAL_EPRL_CONTROL_PASS_ALL_GAMMA'
          else: cls=f'ITER068C_PREPULLBACK_CONTROL_CONVERGENCE_REVIEW_{reviews}_OF_3'
          out={'gate':'ITER068C_PREPULLBACK_DISTRIBUTIONAL_EPRL_CONTROL',
               'frozen_prereg_commit':'19255005545d5c4cd505f8ebc9d3afa2ee3f3aae',
               'lanes':len(rows),'valid':valid,'pass_lanes':passes,'review_lanes':reviews,
               'lane_classifications':{r['gamma']:r['classification'] for r in rows},
               'classification':cls,
               'scope_lock':'Tensor-product pre-pullback control only; correlated collision pullback remains open.'}
          Path('aggregate').mkdir(exist_ok=True)
          Path('aggregate/iter068c-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not valid: raise SystemExit(9)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter068c-aggregate
          path: aggregate/iter068c-aggregate.json
          if-no-files-found: error
          retention-days: 90
