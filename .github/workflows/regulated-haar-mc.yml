name: Regulated Haar Monte Carlo Vertex Pilot

on:
  push:
    branches: [main]
    paths:
      - 'vertex/regulated_haar_mc_vertex.py'
      - 'vertex/direct_causal_integrand_smoke.py'
      - 'regulated/endpoint_precontraction_scan.py'
      - 'regulated/run_with_stable_hyp2f1.py'
      - '.github/workflows/regulated-haar-mc.yml'
  workflow_dispatch:

jobs:
  regulated-mc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        mode: [allplus, onefour, twothree, eprl]
        cutoff: ['0.6','1.0','1.4']
        seed: [101,202]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Run Haar-matched regulated Monte Carlo
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/regulated_haar_mc_vertex.py \
            --gamma 1.2 \
            --mode "${{ matrix.mode }}" \
            --cutoff "${{ matrix.cutoff }}" \
            --samples 32 \
            --seed "${{ matrix.seed }}" \
            --output "results/mc_${{ matrix.mode }}_R${{ matrix.cutoff }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-${{ matrix.mode }}-R${{ matrix.cutoff }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
