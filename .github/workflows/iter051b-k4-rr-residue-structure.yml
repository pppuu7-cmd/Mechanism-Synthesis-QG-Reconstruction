name: Iter051B K4 RR Residue Structure

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_rr_residue_structure.py'
      - 'status/ITERATION_051_RESIDUE_STRUCTURE.md'
      - '.github/workflows/iter051b-k4-rr-residue-structure.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        sign_class: ['+++','++-','+-+','+--','-++','-+-','--+','---']
        tree: ['S0','S1','P0','P1']
        pair: ['01','02','12']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact preregistered residue-structure lane
        env:
          SIGN_CLASS: ${{ matrix.sign_class }}
          TREE: ${{ matrix.tree }}
          PAIR: ${{ matrix.pair }}
        run: |
          mkdir -p results
          python distributional/k4_rr_residue_structure.py \
            --mode compute --sign-class="$SIGN_CLASS" --tree "$TREE" --pair "$PAIR" \
            --output "results/iter051b_${SIGN_CLASS}_${TREE}_${PAIR}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter051b-${{ matrix.sign_class }}-${{ matrix.tree }}-${{ matrix.pair }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter051b-*
          path: collected
          merge-multiple: true
      - name: Aggregate frozen Iter051B gate
        run: |
          mkdir -p results
          python distributional/k4_rr_residue_structure.py \
            --mode aggregate --input-dir collected \
            --output results/iter051b_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter051b-aggregate
          path: results/
          if-no-files-found: warn
