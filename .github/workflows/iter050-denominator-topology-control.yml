name: Iter050 Denominator Pole Topology Control

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_denominator_pole_topology_control.py'
      - 'status/ITERATION_050_DENOMINATOR_CONTROL.md'
      - '.github/workflows/iter050-denominator-topology-control.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        sign_class: ['+++','++-','+-+','+--','-++','-+-','--+','---']
        tree: ['S0','S1','P0','P1']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Denominator-only topology lane
        env:
          SIGN_CLASS: ${{ matrix.sign_class }}
          TREE: ${{ matrix.tree }}
        run: |
          mkdir -p results
          python distributional/k4_denominator_pole_topology_control.py \
            --mode compute --sign-class="$SIGN_CLASS" --tree "$TREE" \
            --output "results/iter050_denctrl_${SIGN_CLASS}_${TREE}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter050-denctrl-${{ matrix.sign_class }}-${{ matrix.tree }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter050-denctrl-*
          path: collected
          merge-multiple: true
      - name: Aggregate denominator topology control
        run: |
          mkdir -p results
          python distributional/k4_denominator_pole_topology_control.py \
            --mode aggregate --input-dir collected \
            --output results/iter050_denominator_control_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter050-denominator-control-aggregate
          path: results/
          if-no-files-found: warn
