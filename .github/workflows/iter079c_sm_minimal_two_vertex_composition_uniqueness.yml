name: Iter079C-SM minimal two-vertex composition uniqueness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER079C_SM_MINIMAL_TWO_VERTEX_COMPOSITION_UNIQUENESS.md'
      - 'distributional/iter079c_sm_minimal_two_vertex_composition_uniqueness.py'
      - '.github/workflows/iter079c_sm_minimal_two_vertex_composition_uniqueness.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter079C-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen lane
        run: |
          mkdir -p out
          python distributional/iter079c_sm_minimal_two_vertex_composition_uniqueness.py --lane '${{ matrix.lane }}' --output 'out/iter079c_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079c-sm-${{ matrix.lane }}
          path: out/iter079c_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter079C-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter079c-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        run: |
          mkdir -p out
          python distributional/iter079c_sm_minimal_two_vertex_composition_uniqueness.py --aggregate-dir downloaded --output out/iter079c_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079c-sm-aggregate
          path: out/iter079c_sm_aggregate.json
          if-no-files-found: error
