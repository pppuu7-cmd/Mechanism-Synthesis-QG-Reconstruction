name: Iter079E-SM KKL gluing inheritance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER079E_SM_KKL_GLUE_INHERITANCE.md'
      - 'distributional/iter079e_sm_kkl_glue_inheritance.py'
      - '.github/workflows/iter079e_sm_kkl_glue_inheritance.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter079E-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen lane
        run: |
          mkdir -p out
          python distributional/iter079e_sm_kkl_glue_inheritance.py --lane '${{ matrix.lane }}' --output 'out/iter079e_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079e-sm-${{ matrix.lane }}
          path: out/iter079e_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter079E-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter079e-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        run: |
          mkdir -p out
          python distributional/iter079e_sm_kkl_glue_inheritance.py --aggregate-dir downloaded --output out/iter079e_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter079e-sm-aggregate
          path: out/iter079e_sm_aggregate.json
          if-no-files-found: error
