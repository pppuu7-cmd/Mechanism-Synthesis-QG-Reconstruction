name: Spectral i-epsilon Toller PV Check

on:
  push:
    branches: [main]
    paths:
      - "regulated/spectral_iepsilon_pv_check.py"
      - "regulated/run_with_stable_hyp2f1.py"
      - ".github/workflows/spectral-iepsilon-pv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectral-pv:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gamma: '0.5'
            two_l: 1
          - gamma: '0.5'
            two_l: 3
          - gamma: '1.2'
            two_l: 1
          - gamma: '1.2'
            two_l: 3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'mpmath==1.3.0' sympy
      - name: Evaluate spectral PV reconstruction
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py \
            regulated/spectral_iepsilon_pv_check.py \
            --gamma "${{ matrix.gamma }}" \
            --two-l "${{ matrix.two_l }}" \
            --two-p 1 \
            --beta 0.7 \
            --output "results/spectral_pv_g${{ matrix.gamma }}_l${{ matrix.two_l }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-pv-g${{ matrix.gamma }}-l${{ matrix.two_l }}
          path: results/
          if-no-files-found: error
          retention-days: 30
