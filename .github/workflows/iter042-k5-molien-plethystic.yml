name: Iter042 K5 Molien Plethystic Audit

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k5_molien_plethystic_audit.py'
      - '.github/workflows/iter042-k5-molien-plethystic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molien-plethystic:
    strategy:
      fail-fast: false
      matrix:
        max_degree: [24,32,40]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.1.3'
      - name: Compute S5 invariant-ring fingerprint
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python distributional/k5_molien_plethystic_audit.py \
            --max-degree "${{ matrix.max_degree }}" \
            --output "results/iter042_molien_${{ matrix.max_degree }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter042-molien-${{ matrix.max_degree }}
          path: results/
          if-no-files-found: error
          retention-days: 30
