name: K5 34-orbit matching-key frame repair3 preflight
# Frozen implementation already committed; this workflow-only touch triggers the preflight.

on:
  push:
    paths:
      - 'prereg/K5_34_ORBIT_MATCHING_KEY_FRAME_CONTROL_REPAIR_3_PREFLIGHT.md'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_core_repair3_matching_key_frame.py'
      - 'scripts/k5_34_orbit_matching_key_frame_repair3_preflight.py'
      - '.github/workflows/k5_34_orbit_matching_key_frame_repair3_preflight.yml'
  workflow_dispatch:

jobs:
  exact-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen matching-key repair3 preflight
        shell: bash
        run: |
          set +e
          python scripts/k5_34_orbit_matching_key_frame_repair3_preflight.py \
            --output repair3_preflight.json \
            > repair3_preflight_stdout.txt 2>&1
          rc=$?
          echo "$rc" > repair3_preflight_exit_code.txt
          cat repair3_preflight_stdout.txt
          exit 0

      - name: Validate frozen preflight classification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('repair3_preflight.json').read_text())
          allowed={
              'PASS_MATCHING_KEY_FRAME_REPAIR3_PREFLIGHT',
              'INVALID_IMPLEMENTATION_OR_PROVENANCE',
              'MATCHING_KEY_FRAME_REPAIR3_PREFLIGHT_SCIENTIFIC_MISMATCH',
          }
          assert r['classification'] in allowed, r.get('classification')
          assert r['prereg_commit']=='4ee6c6f3056c5934a5209a4f05616b73354b4e6e'
          assert r['core_commit']=='6d6dd17e579d7aeb2a793bfa1becbe611174f191'
          assert r['q18_values_used'] is False
          assert r['N_B_orders_or_coefficients_used'] is False
          assert r['heavy_resolver_launched'] is False
          if r['classification']=='PASS_MATCHING_KEY_FRAME_REPAIR3_PREFLIGHT':
              assert all(r['validity'].values())
              assert all(r['census_and_relations'].values())
              assert all(r['g8_stages'].values())
              assert all(r['malformed_controls'].values())
          print('FROZEN_PREFLIGHT_CLASSIFICATION='+r['classification'])
          if r['classification']!='PASS_MATCHING_KEY_FRAME_REPAIR3_PREFLIGHT':
              raise SystemExit(2)
          PY

      - name: Upload immutable preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-34-orbit-matching-key-frame-repair3-preflight
          path: |
            repair3_preflight.json
            repair3_preflight_stdout.txt
            repair3_preflight_exit_code.txt
          if-no-files-found: error
          retention-days: 90
