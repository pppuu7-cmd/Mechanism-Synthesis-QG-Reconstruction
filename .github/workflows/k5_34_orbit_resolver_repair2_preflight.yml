name: K5 34-orbit resolver repair2 preflight

on:
  push:
    paths:
      - '.github/workflows/k5_34_orbit_resolver_repair2_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run exact repair2 static controls
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          p=Path('scripts/k5_34_orbit_exact_leading_coefficient_core_repair2.py')
          s=importlib.util.spec_from_file_location('repair2_preflight',p)
          m=importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          checks=m.static_checks()
          bad=sorted(k for k,v in checks.items() if not bool(v))
          out={
            'gate':'K5_34_ORBIT_RESOLVER_REPAIR2_PREFLIGHT',
            'repair2_prereg_commit':'beadf232a89331f62a3e129e83e23576e2a33021',
            'repair2_implementation_commit':'74139678dac94735c8b387578d11e96538f71134',
            'classification':'PASS_REPAIR2_PREFLIGHT' if not bad else 'INVALID_IMPLEMENTATION',
            'checks':checks,
            'failed_checks':bad,
            'heavy_science_executed':False,
            'q18_values_used':False,
          }
          Path('repair2_preflight.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('CLASSIFICATION='+out['classification'])
          print('FAILED='+json.dumps(bad))
          raise SystemExit(0 if not bad else 2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-34-orbit-resolver-repair2-preflight
          path: repair2_preflight.json
          if-no-files-found: error
          retention-days: 90
