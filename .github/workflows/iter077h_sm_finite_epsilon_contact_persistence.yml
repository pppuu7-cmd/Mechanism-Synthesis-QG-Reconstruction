name: Iter077H-SM finite epsilon contact persistence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/ITER077H_SM_FINITE_EPSILON_JHALF_CONTACT_DERIVATION.md'
      - 'prereg/ITER077H_SM_FINITE_EPSILON_CONTACT_PERSISTENCE.md'
      - 'distributional/iter077h_sm_finite_epsilon_contact_persistence.py'
      - 'results/ITER077G_SM_CORRECTED_JHALF_CONTACT_MICROLOCAL_SCALING_RESULT.md'
      - 'status/ITER077_CONTACT_FORMULA_ERRATUM.md'
      - '.github/workflows/iter077h_sm_finite_epsilon_contact_persistence.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter077H-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter077h_sm_finite_epsilon_contact_persistence.py \
            --lane '${{ matrix.lane }}' \
            --output 'out/iter077h_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077h-sm-${{ matrix.lane }}
          path: out/iter077h_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter077H-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter077h-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter077h_sm_finite_epsilon_contact_persistence.py \
            --aggregate-dir downloaded \
            --output out/iter077h_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077h-sm-aggregate
          path: out/iter077h_sm_aggregate.json
          if-no-files-found: error
