name: Native Toller Kernel

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-toller-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointwise-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build long-double Toller kernel
        run: gcc -std=gnu11 -O2 -Wall -Wextra -Inative native/toller_kernel.c native/toller_kernel_probe.c -lm -o /tmp/toller_kernel_probe
      - name: Generate native pointwise grid
        run: mkdir -p results && /tmp/toller_kernel_probe > results/native_toller_probe.tsv
      - name: Validate against 80-dps analytic oracle
        run: python -m pip install -q mpmath && python native/validate_toller_kernel.py results/native_toller_probe.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: native-toller-pointwise
          path: results/
          retention-days: 30

  precision-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive adaptive precision budget over causal sector
        run: python -m pip install -q mpmath && python native/toller_precision_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-toller-precision-policy
          path: results/toller_precision_policy.json
          retention-days: 30

  long-double-stress-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stress probe
        run: gcc -std=gnu11 -O2 -Wall -Wextra -Inative native/toller_kernel.c native/toller_kernel_stress_probe.c -lm -o /tmp/toller_kernel_stress
      - name: Generate low-beta high-Dl native grid
        run: mkdir -p results && /tmp/toller_kernel_stress > results/native_toller_stress.tsv
      - name: Measure long-double stability envelope against 90-dps oracle
        run: python -m pip install -q mpmath && python native/assess_toller_kernel_stress.py results/native_toller_stress.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: native-toller-stress-envelope
          path: results/
          retention-days: 30
