name: Iter076M source Lorentz orientation pseudoscalar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076m_source_lorentz_orientation_pseudoscalar.yml'
      - 'distributional/iter076m_source_lorentz_orientation_pseudoscalar.py'
      - 'prereg/ITER076M_SOURCE_LORENTZ_ORIENTATION_PSEUDOSCALAR.md'
      - 'sources/LORENTZIAN_PROPER_VERTEX_ORIENTATION_2016_SOURCE_SNAPSHOT.md'

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          mkdir -p out
          python distributional/iter076m_source_lorentz_orientation_pseudoscalar.py --lane ${{ matrix.lane }} --output out/iter076m_${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter076m-${{ matrix.lane }}
          path: out/iter076m_${{ matrix.lane }}.json
          if-no-files-found: error
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076m-*
          path: downloaded
      - run: |
          mkdir -p out
          python distributional/iter076m_source_lorentz_orientation_pseudoscalar.py --aggregate-dir downloaded --output out/iter076m_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter076m-aggregate
          path: out/iter076m_aggregate.json
          if-no-files-found: error
