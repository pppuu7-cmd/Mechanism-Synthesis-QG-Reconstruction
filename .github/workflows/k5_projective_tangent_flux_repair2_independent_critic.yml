name: K5 tangent-flux repair2 independent Critic
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/k5_projective_tangent_flux_repair2_independent_critic.py'
      - '.github/workflows/k5_projective_tangent_flux_repair2_independent_critic.yml'
jobs:
  independent-critic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install exact symbolic dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Download and verify authoritative parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/k5_tangent_flux_repair2_critic/parent
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10466668706/zip" \
            -o artifacts/k5_tangent_flux_repair2_critic/parent.zip
          echo '3c6d2894b184bd8177a6d0c5eaced31c62c49b3b813710e9e9f118eeffd52b3e  artifacts/k5_tangent_flux_repair2_critic/parent.zip' | sha256sum -c -
          unzip -q artifacts/k5_tangent_flux_repair2_critic/parent.zip -d artifacts/k5_tangent_flux_repair2_critic/parent
          echo '017f25d431bbf137aefd9f375ddbefbff45d551bfda4fd46a0a55a825aa91fe3  artifacts/k5_tangent_flux_repair2_critic/parent/result.json' | sha256sum -c -
      - name: Run independent exact Critic reconstruction
        run: |
          set -euo pipefail
          python scripts/k5_projective_tangent_flux_repair2_independent_critic.py \
            --parent-json artifacts/k5_tangent_flux_repair2_critic/parent/result.json \
            --researcher-source scripts/k5_projective_tangent_normal_flux_exact.py \
            --out artifacts/k5_tangent_flux_repair2_critic/critic_result.json \
            | tee artifacts/k5_tangent_flux_repair2_critic/critic_stdout.txt
      - name: Validate outcome-neutral Critic payload
        run: |
          python - <<'PY'
          import json
          p='artifacts/k5_tangent_flux_repair2_critic/critic_result.json'
          d=json.load(open(p))
          allowed={'CONFIRMED_SCOPED','SCIENTIFIC_FAIL_CONFIRMED','INVALID_IMPLEMENTATION','INVALID_PROVENANCE','QUALIFIED'}
          assert d['verdict'] in allowed, d['verdict']
          assert len(d['explicit_witnesses'])==18
          assert len(d['chart_relations'])==9
          assert len(d['permutation']['witnesses'])==9
          assert all(v is None for v in d['interpretation_ceiling'].values())
          print('VERDICT=',d['verdict'])
          print('PROVENANCE=',d['provenance_checks'])
          print('COVERAGE=',d['coverage_checks'])
          print('MATH=',d['math_checks'])
          print('EXCEPTIONAL=',d['exceptional'])
          PY
          sha256sum artifacts/k5_tangent_flux_repair2_critic/critic_result.json | tee artifacts/k5_tangent_flux_repair2_critic/critic_result_sha256.txt
      - name: Upload independent Critic witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-tangent-flux-repair2-independent-critic
          path: artifacts/k5_tangent_flux_repair2_critic/
          retention-days: 90
