name: Iter069A K4 Joint Spectral Homogeneous Audit

on:
  push:
    branches: [main]
    paths:
      - 'distributional/iter069a_k4_joint_spectral_homogeneous.py'
      - 'status/ITERATION_069A_PREREG.md'
      - '.github/workflows/iter069a-k4-joint-spectral-homogeneous.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tree: ['S0','S1','P0','P1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip sympy
      - name: Run exact symbolic homogeneous lane
        run: |
          mkdir -p results
          PYTHONPATH=. python distributional/iter069a_k4_joint_spectral_homogeneous.py \
            --tree '${{ matrix.tree }}' --output 'results/iter069a_${{ matrix.tree }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter069a-${{ matrix.tree }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    runs-on: ubuntu-24.04
    needs: [audit]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter069a-*
          path: gathered
          merge-multiple: true
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json
          from pathlib import Path
          rows=[json.load(open(f,encoding='utf-8')) for f in sorted(glob.glob('gathered/*.json'))]
          target='ITER069A_K4_JOINT_SPECTRAL_HOMOGENEOUS_GROWTH_PLUS6_EXACT'
          valid=len(rows)==4 and all(r.get('valid') and r.get('classification')==target for r in rows)
          out={'gate':'ITER069A_K4_JOINT_SPECTRAL_HOMOGENEOUS_ASYMPTOTICS',
               'frozen_prereg_commit':'50a73e7e95d68d17c8d419998ae3d691dbc61417',
               'lanes':len(rows),'all_valid':valid,
               'source_degrees':sorted({r.get('source_net_degree') for r in rows}),
               'control_degrees':sorted({r.get('control_net_degree') for r in rows}),
               'classification':target if valid else 'ITER069A_SYMBOLIC_ASYMPTOTIC_REVIEW',
               'scope_lock':'Reduced joint-spectral rational family only; no physical vertex divergence theorem.'}
          Path('aggregate').mkdir(exist_ok=True)
          Path('aggregate/iter069a-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not valid: raise SystemExit(9)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter069a-aggregate
          path: aggregate/iter069a-aggregate.json
          if-no-files-found: error
          retention-days: 90
