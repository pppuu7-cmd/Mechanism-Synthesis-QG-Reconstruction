name: Iter076W compact node gauge one-jet closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076w_compact_node_gauge_onejet_closure.yml'
      - 'distributional/iter076w_compact_node_gauge_onejet_closure.py'
      - 'prereg/ITER076W_COMPACT_NODE_GAUGE_ONEJET_CLOSURE.md'
      - 'sources/TOLLER_COMPACT_NODE_GAUGE_ONEJET_SUPPLEMENT.md'

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane ${{ matrix.lane }}
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076w_compact_node_gauge_onejet_closure.py --lane '${{ matrix.lane }}' --output 'out/iter076w_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076w-${{ matrix.lane }}
          path: out/iter076w_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076w-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076w_compact_node_gauge_onejet_closure.py --aggregate-dir downloaded --output out/iter076w_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076w-aggregate
          path: out/iter076w_aggregate.json
          if-no-files-found: error
