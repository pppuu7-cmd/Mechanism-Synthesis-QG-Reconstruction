name: Iter047 K4 FP Commutator Localization

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_fp_commutator_localization.py'
      - 'status/ITERATION_047.md'
      - '.github/workflows/iter047-k4-fp-commutators.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        case: ['A','B']
        tree: ['S0','S1','P0','P1']
        pair: ['01','02','12']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact pairwise FP commutator lane
        env:
          CASE: ${{ matrix.case }}
          TREE: ${{ matrix.tree }}
          PAIR: ${{ matrix.pair }}
        run: |
          mkdir -p results
          if [ "$CASE" = "A" ]; then
            GAMMA='0.83'; EPSILON='0.06'; SIGNS='++++++'; K='0.19,-0.31,0.27,-0.15'
          else
            GAMMA='1.43'; EPSILON='0.12'; SIGNS='-++-++'; K='-0.22,0.37,-0.28,0.13'
          fi
          python distributional/k4_fp_commutator_localization.py \
            --mode compute --case "$CASE" --gamma "$GAMMA" --epsilon "$EPSILON" \
            --signs="$SIGNS" --k="$K" --tree "$TREE" --pair "$PAIR" \
            --output "results/iter047_${CASE}_${TREE}_${PAIR}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter047-lane-${{ matrix.case }}-${{ matrix.tree }}-${{ matrix.pair }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter047-lane-*
          path: collected
          merge-multiple: true
      - name: Aggregate frozen commutator gate
        run: |
          mkdir -p results
          python distributional/k4_fp_commutator_localization.py \
            --mode aggregate --input-dir collected \
            --output results/iter047_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter047-aggregate
          path: results/
          if-no-files-found: error
