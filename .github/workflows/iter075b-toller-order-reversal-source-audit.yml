name: Iter075B Toller order-reversal source audit

on:
  push:
    branches:
      - research/iter075b-toller-order-reversal-source-audit
  workflow_dispatch:

jobs:
  source-authority-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen source-authority audit
        run: python distributional/iter075b_toller_order_reversal_source_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: iter075b-source-audit
          path: out/iter075b-source-audit.json
          if-no-files-found: error
          retention-days: 90
