name: K5 34-orbit resolver S5 minimal defect localization
on:
  push:
    paths:
      - '.github/workflows/k5_34_orbit_resolver_s5_minimal_defect_localization.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact frozen diagnostic
        run: python scripts/k5_34_orbit_resolver_s5_minimal_defect_localization.py --output results/raw/k5_34_orbit_resolver_s5_minimal_defect_localization.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-34-orbit-resolver-s5-minimal-defect-localization
          path: results/raw/k5_34_orbit_resolver_s5_minimal_defect_localization.json
          if-no-files-found: warn
