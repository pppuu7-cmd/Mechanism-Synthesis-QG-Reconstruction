name: K5 exact cancellation unprojected boundary dual S5 diagnostic repair5

on:
  workflow_dispatch:
  push:
    paths:
      - 'prereg/K5_EXACT_CANCELLATION_UNPROJECTED_BOUNDARY_DUAL_S5_DIAGNOSTIC_REPAIR5.md'
      - 'scripts/k5_exact_cancellation_unprojected_boundary_dual_s5_shard_repair5.py'
      - 'scripts/k5_exact_cancellation_unprojected_boundary_dual_s5_aggregate_repair5.py'
      - '.github/workflows/k5_exact_cancellation_unprojected_boundary_dual_s5_diagnostic_repair5.yml'

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        label: [W1_base, W1_cycle, W1_inverse, W2_base, W2_cycle, W2_inverse]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prospective lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f472eb29ded6a04ab1ae8a5f367d378f64beee4f HEAD
          git merge-base --is-ancestor f6fb4e6d2c747d6b6a704982347d81ba324a50d7 HEAD
          git merge-base --is-ancestor 5a7359d8b4124f24ed5f5e4b59f6990c7e9b598d HEAD
          git merge-base --is-ancestor d7c891f35458db1b2fa6c9340d16e723f2d1d0f5 HEAD
          git merge-base --is-ancestor 41f26f8e314f4ab1213fe6a681b69d2c87e00d68 HEAD
          git merge-base --is-ancestor d6b0e805101c8590eafac71398cc2b1466691752 HEAD
      - name: Run import-safe exact frozen alpha shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/repair5-shards
          python scripts/k5_exact_cancellation_unprojected_boundary_dual_s5_shard_repair5.py \
            --label '${{ matrix.label }}' \
            --output 'artifacts/repair5-shards/${{ matrix.label }}.json'
          sha256sum 'artifacts/repair5-shards/${{ matrix.label }}.json' | tee 'artifacts/repair5-shards/${{ matrix.label }}.sha256'
      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-dual-repair5-${{ matrix.label }}
          path: artifacts/repair5-shards/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prospective lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f472eb29ded6a04ab1ae8a5f367d378f64beee4f HEAD
          git merge-base --is-ancestor f6fb4e6d2c747d6b6a704982347d81ba324a50d7 HEAD
          git merge-base --is-ancestor 5a7359d8b4124f24ed5f5e4b59f6990c7e9b598d HEAD
          git merge-base --is-ancestor d7c891f35458db1b2fa6c9340d16e723f2d1d0f5 HEAD
          git merge-base --is-ancestor 41f26f8e314f4ab1213fe6a681b69d2c87e00d68 HEAD
          git merge-base --is-ancestor d6b0e805101c8590eafac71398cc2b1466691752 HEAD
      - name: Download all complete shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: boundary-dual-repair5-*
          path: artifacts/repair5-input
          merge-multiple: true
      - name: Aggregate exact parent diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/repair5-aggregate
          python scripts/k5_exact_cancellation_unprojected_boundary_dual_s5_aggregate_repair5.py \
            --shards artifacts/repair5-input \
            --output artifacts/repair5-aggregate/result.json \
            | tee artifacts/repair5-aggregate/stdout.txt
          python - <<'PY'
          import json
          p='artifacts/repair5-aggregate/result.json'
          d=json.load(open(p,encoding='utf-8'))
          allowed={
            'BOUNDARY_DUAL_CONTRAGREDIENT_S5_EXACT',
            'BOUNDARY_S5_OTHER_REPRESENTATION_EXACT',
            'DUAL_COORDINATE_EXTRACTION_MISMATCH_EXACT',
            'BOUNDARY_S5_REPRESENTATION_UNRESOLVED_EXACT',
          }
          assert d['classification'] in allowed,d['classification']
          assert all(d['checks'].values()),d['checks']
          assert all(d['execution_repair5_checks'].values()),d['execution_repair5_checks']
          assert d['physical_corner_coefficients_used'] is False
          assert d['scientific_verdict'] is None
          assert len(d['shard_manifest'])==6
          print('CLASSIFICATION=',d['classification'])
          print('LAW=',d['unique_consistent_law'])
          print('DUAL_INVARIANT=',d['dual_coordinates_invariant_all'])
          print('COORD_EXTRACTION=',d['coordinate_extraction_exact_all'])
          PY
          sha256sum artifacts/repair5-aggregate/result.json | tee artifacts/repair5-aggregate/result_sha256.txt
      - name: Upload aggregate artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-exact-cancellation-unprojected-boundary-dual-s5-diagnostic-repair5
          path: artifacts/repair5-aggregate/
          retention-days: 90
          if-no-files-found: error
