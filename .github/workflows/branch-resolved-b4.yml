name: Branch-Resolved Toller B4

on:
  push:
    branches: [main]
    paths:
      - "branch/**"
      - ".github/workflows/branch-resolved-b4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dump ordinary complex B4 QAGP tensor
        run: bash branch/sl2cfoam_branch_b4_shard.sh baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-b4-baseline
          path: results/
          if-no-files-found: error
          retention-days: 30

  branch-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Integrate four Toller branch masks
        run: bash branch/sl2cfoam_branch_b4_shard.sh ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-b4-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    runs-on: ubuntu-latest
    needs: [baseline, branch-shard]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: branch-b4-*
          path: all-results
      - name: Sum all 16 complex branch tensors and compare to ordinary B4
        run: python -m pip install -q mpmath && python branch/aggregate_branch_b4.py --input all-results --output branch-results/branch_b4_verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-b4-combined-verdict
          path: branch-results/
          if-no-files-found: warn
          retention-days: 30
