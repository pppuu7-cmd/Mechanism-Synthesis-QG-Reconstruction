name: K5 34-orbit component1 support-mixing diagnostic repair1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/k5_34_orbit_component1_support_mixing_defect_diagnostic_repair1.py'
      - '.github/workflows/k5_34_orbit_component1_support_mixing_defect_diagnostic_repair1.yml'
      - 'prereg/K5_34_ORBIT_COMPONENT1_SUPPORT_MIXING_DIAGNOSTIC_CONTROL_REPAIR_1.md'
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repaired exact component1 diagnostic
        run: |
          mkdir -p artifacts
          python scripts/k5_34_orbit_component1_support_mixing_defect_diagnostic_repair1.py \
            --output artifacts/result.json | tee artifacts/stdout.txt
      - name: Validate frozen diagnostic surface
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('artifacts/result.json')
          assert p.exists()
          d=json.load(open(p,encoding='utf-8'))
          assert d['classification'] in {
            'INVALID_IMPLEMENTATION_OR_PROVENANCE',
            'K5_S5_COMPONENT1_DEFECT_SUPPORT_INDEX_MISSING_OR_SPURIOUS',
            'K5_S5_COMPONENT1_DEFECT_SUPPORT_COEFFICIENT',
            'K5_S5_COMPONENT1_SUPPORT_MIXING_EXACT',
          }
          assert d['scientific_verdict'] is None
          assert d['no_N_B_orders_or_coefficients_recorded'] is True
          assert d['invalid_resolver_values_consumed'] is False
          assert d['q18_values_consumed'] is False
          print(d['classification'])
          PY
          sha256sum artifacts/result.json > artifacts/result_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-34-orbit-component1-support-mixing-diagnostic-repair1
          path: artifacts/
          if-no-files-found: error
