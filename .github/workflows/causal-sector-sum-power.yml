name: Causal Sector Sum Collision Power

on:
  push:
    branches: [main]
    paths:
      - 'vertex/causal_sector_sum_power.py'
      - '.github/workflows/causal-sector-sum-power.yml'
  workflow_dispatch:

jobs:
  sector-sum-power:
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [17,41]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Measure summed causal-sector collision powers
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/causal_sector_sum_power.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/sector_sum_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sector-sum-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          retention-days: 30
