name: Christensen Tree Bound Adaptation

on:
  push:
    branches: [main]
    paths:
      - 'finiteness/christensen_tree_bound.py'
      - 'finiteness/toller_weighted_norm_scan.py'
      - '.github/workflows/christensen-tree-bound.yml'
  workflow_dispatch:

jobs:
  exact-graph-bound:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact K5 tree-cover bound
        run: |
          mkdir -p results
          python finiteness/christensen_tree_bound.py --output results/christensen_tree_bound.json
      - uses: actions/upload-artifact@v4
        with:
          name: christensen-exact-tree-bound
          path: results/
          retention-days: 30

  weighted-toller-norm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [73,131]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Scan weighted Toller operator norm
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py finiteness/toller_weighted_norm_scan.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/toller_norm_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toller-weighted-norm-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
