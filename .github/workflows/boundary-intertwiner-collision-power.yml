name: Boundary Intertwiner Collision Power

on:
  push:
    branches: [main]
    paths:
      - 'vertex/boundary_intertwiner_collision_power.py'
      - 'vertex/multicollision_power_counting.py'
      - 'vertex/regulated_haar_mc_vertex.py'
      - 'regulated/endpoint_precontraction_scan.py'
      - 'regulated/run_with_stable_hyp2f1.py'
      - '.github/workflows/boundary-intertwiner-collision-power.yml'
  workflow_dispatch:

jobs:
  boundary-power:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [19,43]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Contract boundary intertwiners and measure collision powers
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/boundary_intertwiner_collision_power.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/boundary_power_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-power-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
