name: Iter073D transitive proper-face cone geometry
on:
  push:
    paths:
      - '.github/workflows/iter073d-transitive-face-cones.yml'
      - 'distributional/iter073d_transitive_face_cones.py'
      - 'status/ITERATION_073D_PREREG.md'
  workflow_dispatch:
jobs:
  exact-cones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy numpy scipy
      - name: Run frozen exact proper-face cone audit
        run: |
          mkdir -p out
          python -m distributional.iter073d_transitive_face_cones --output out/iter073d-aggregate.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter073d-aggregate
          path: out/iter073d-aggregate.json
          if-no-files-found: error
          retention-days: 90
