name: Multiwedge Incidence Distribution Product Audit

on:
  push:
    branches: [main]
    paths:
      - 'distributional/multiwedge_incidence_product_audit.py'
      - '.github/workflows/multiwedge-incidence-product.yml'
  workflow_dispatch:

jobs:
  incidence-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        k: [3,4,5]
        include:
          - k: 3
            rho: '0.2'
            j2: 1
          - k: 4
            rho: '0.6'
            j2: 2
          - k: 5
            rho: '1.0'
            j2: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q numpy
      - name: Audit multiwedge distribution-product geometry
        run: |
          mkdir -p results
          python distributional/multiwedge_incidence_product_audit.py \
            --k "${{ matrix.k }}" --rho "${{ matrix.rho }}" --j2 "${{ matrix.j2 }}" \
            --output "results/incidence_k${{ matrix.k }}_j2${{ matrix.j2 }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incidence-k${{ matrix.k }}-j2${{ matrix.j2 }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
