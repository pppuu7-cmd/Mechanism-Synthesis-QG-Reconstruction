name: Iter076Q Hodge-line Sym2 quadratic descent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076q_hodge_line_sym2_quadratic_descent.yml'
      - 'distributional/iter076q_hodge_line_sym2_quadratic_descent.py'
      - 'prereg/ITER076Q_HODGE_LINE_SYM2_QUADRATIC_DESCENT.md'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane ${{ matrix.lane }}
        run: |
          mkdir -p out
          python distributional/iter076q_hodge_line_sym2_quadratic_descent.py --lane '${{ matrix.lane }}' --output 'out/iter076q_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076q-${{ matrix.lane }}
          path: out/iter076q_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076q-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        run: |
          mkdir -p out
          python distributional/iter076q_hodge_line_sym2_quadratic_descent.py --aggregate-dir downloaded --output out/iter076q_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076q-aggregate
          path: out/iter076q_aggregate.json
          if-no-files-found: error
