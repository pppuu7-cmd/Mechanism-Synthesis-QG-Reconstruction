name: Iter076Z Toller front-face nonscalar obstruction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076z_toller_front_face_nonscalar_obstruction.yml'
      - 'distributional/iter076z_toller_front_face_nonscalar_obstruction.py'
      - 'prereg/ITER076Z_TOLLER_FRONT_FACE_NONSCALAR_OBSTRUCTION.md'
      - 'sources/TOLLER_FRONT_FACE_NONSCALAR_SUPPLEMENT.md'
      - 'results/ITER076X_TOLLER_NORMAL_BLOWUP_CONNECTION_RESULT.md'
      - 'results/ITER076Y_MIXED_POLAR_KAK_CONNECTION_ENTRY_RESULT.md'

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane ${{ matrix.lane }}
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076z_toller_front_face_nonscalar_obstruction.py --lane '${{ matrix.lane }}' --output 'out/iter076z_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076z-${{ matrix.lane }}
          path: out/iter076z_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076z-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076z_toller_front_face_nonscalar_obstruction.py --aggregate-dir downloaded --output out/iter076z_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076z-aggregate
          path: out/iter076z_aggregate.json
          if-no-files-found: error
