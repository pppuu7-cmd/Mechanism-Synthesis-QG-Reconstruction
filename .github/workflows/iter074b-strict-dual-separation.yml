name: Iter074B strict dual separation
on:
  push:
    paths:
      - '.github/workflows/iter074b-strict-dual-separation.yml'
      - 'distributional/iter074b_strict_dual_separation.py'
      - 'status/ITERATION_074B_PREREG.md'
  workflow_dispatch:
jobs:
  strict-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy numpy scipy
      - name: Run frozen exact strict-dual audit
        run: |
          mkdir -p out
          python -m distributional.iter074b_strict_dual_separation --output out/iter074b-aggregate.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter074b-aggregate
          path: out/iter074b-aggregate.json
          if-no-files-found: error
          retention-days: 90
