name: Pair Exclusion Monte Carlo Extrapolation

on:
  push:
    branches: [main]
    paths:
      - 'vertex/pair_exclusion_mc.py'
      - 'vertex/regulated_haar_mc_vertex.py'
      - 'vertex/direct_causal_integrand_smoke.py'
      - 'regulated/endpoint_precontraction_scan.py'
      - 'regulated/run_with_stable_hyp2f1.py'
      - '.github/workflows/pair-exclusion-mc.yml'
  workflow_dispatch:

jobs:
  pair-exclusion:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [allplus, onefour, twothree, eprl]
        seed: [303, 707]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Run nested pair-exclusion scan
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/pair_exclusion_mc.py \
            --gamma '1.2' \
            --mode "${{ matrix.mode }}" \
            --cutoff 1.0 \
            --samples 512 \
            --seed "${{ matrix.seed }}" \
            --output "results/pair_exclusion_${{ matrix.mode }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-exclusion-${{ matrix.mode }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
