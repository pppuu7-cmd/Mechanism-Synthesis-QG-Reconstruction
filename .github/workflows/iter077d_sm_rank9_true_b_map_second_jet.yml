name: Iter077D-SM rank9 true B-map second jet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/CAUSAL_SPINFOAM_VERTEX_2026_TRUE_B_MAP_TRANSVERSALITY_SUPPLEMENT.md'
      - 'sources/CAUSAL_SPINFOAM_VERTEX_2026_B_MAP_SECOND_JET_SUPPLEMENT.md'
      - 'prereg/ITER077D_SM_RANK9_TRUE_B_MAP_SECOND_JET.md'
      - 'distributional/iter077d_sm_rank9_true_b_map_second_jet.py'
      - 'results/ITER077A_TRUE_SOURCE_B_MAP_TRANSVERSALITY_RESULT.md'
      - 'results/ITER077C_SM_SOURCE_COLLISION_EXCEPTIONAL_STRATA_RESULT.md'
      - '.github/workflows/iter077d_sm_rank9_true_b_map_second_jet.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter077D-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane
        run: |
          mkdir -p out
          python distributional/iter077d_sm_rank9_true_b_map_second_jet.py \
            --lane '${{ matrix.lane }}' \
            --output 'out/iter077d_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077d-sm-${{ matrix.lane }}
          path: out/iter077d_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter077D-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter077d-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        run: |
          mkdir -p out
          python distributional/iter077d_sm_rank9_true_b_map_second_jet.py \
            --aggregate-dir downloaded \
            --output out/iter077d_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077d-sm-aggregate
          path: out/iter077d_sm_aggregate.json
          if-no-files-found: error
