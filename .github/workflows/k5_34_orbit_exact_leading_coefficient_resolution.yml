name: K5 34-orbit exact leading coefficient resolution

on:
  push:
    paths:
      - 'prereg/K5_34_ORBIT_EXACT_LEADING_COEFFICIENT_CANCELLATION_RESOLUTION.md'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_core.py'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_shard.py'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_aggregate.py'
      - 'results/raw/k5_full_source_boundary_s5_independent_critic_authoritative.json'
      - '.github/workflows/k5_34_orbit_exact_leading_coefficient_resolution.yml'
  workflow_dispatch:

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact orbit shard
        run: |
          python scripts/k5_34_orbit_exact_leading_coefficient_shard.py \
            --shard '${{ matrix.shard }}' --nshards 8 \
            --output 'shard_${{ matrix.shard }}.json'
      - name: Validate shard contract only
        run: |
          python - <<'PY'
          import json,os
          s=os.environ['SHARD'];p=f'shard_{s}.json';d=json.load(open(p))
          assert d['prereg_commit']=='d6b0e805101c8590eafac71398cc2b1466691752'
          assert d['shard']==int(s) and d['nshards']==8
          assert d['status']=='SHARD_COMPLETE_EXACT_CONTROL_ONLY'
          assert d['scientific_classification'] is None
          assert len(d['rows'])==4
          print('SHARD_COMPLETE=',s)
          PY
        env:
          SHARD: '${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-34-resolver-shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: k5-34-resolver-shard-*
          path: shards
          merge-multiple: true
      - name: Recompute full exact projective-normal coefficient authority
        run: |
          python scripts/k5_projective_normal_32orbit_exact_corner_order.py \
            --output projective_normal_full.json
      - name: Aggregate exact 64-component resolution
        run: |
          python scripts/k5_34_orbit_exact_leading_coefficient_aggregate.py \
            --shard-dir shards \
            --u-result projective_normal_full.json \
            --output result.json \
            --coefficients coefficients.json.gz
      - name: Validate terminal classifier surface
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('result.json'))
          allowed={
            'K5_34_ORBIT_EXACT_LEADING_COEFFICIENT_CANCELLATION_RESOLUTION_EXACT_SCOPED',
            'K5_34_ORBIT_EXACT_LEADING_COEFFICIENT_CANCELLATION_RESOLUTION_PARTIAL_BLOCKED_SCOPED',
            'INVALID_IMPLEMENTATION',
          }
          assert r['classification'] in allowed
          assert r['prereg_commit']=='d6b0e805101c8590eafac71398cc2b1466691752'
          assert r['proper_orbits']==32 and r['physical_channel_orbit_components']==64
          assert os.path.exists('coefficients.json.gz')
          print('FINAL_CLASSIFICATION='+r['classification'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-34-orbit-exact-leading-coefficient-resolution
          path: |
            result.json
            coefficients.json.gz
            projective_normal_full.json
          if-no-files-found: error
          retention-days: 90
