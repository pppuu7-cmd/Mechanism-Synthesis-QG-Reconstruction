name: K5 matching-key repair3 static validity diagnostic

on:
  push:
    paths:
      - 'prereg/K5_34_ORBIT_MATCHING_KEY_FRAME_REPAIR3_STATIC_VALIDITY_DIAGNOSTIC.md'
      - 'scripts/k5_34_orbit_matching_key_frame_repair3_static_validity_diagnostic.py'
      - '.github/workflows/k5_34_orbit_matching_key_frame_repair3_static_validity_diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen static validity diagnostic
        run: |
          python scripts/k5_34_orbit_matching_key_frame_repair3_static_validity_diagnostic.py --output static_validity.json | tee static_validity_stdout.txt
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-matching-key-repair3-static-validity-diagnostic
          path: |
            static_validity.json
            static_validity_stdout.txt
          if-no-files-found: error
          retention-days: 90
