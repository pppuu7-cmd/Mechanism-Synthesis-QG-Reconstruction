name: Iter077F-SM rank9 contact scaling extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/CAUSAL_SPINFOAM_VERTEX_2026_RANK9_CONTACT_SCALING_SUPPLEMENT.md'
      - 'prereg/ITER077F_SM_RANK9_CONTACT_SCALING_EXTENSION.md'
      - 'distributional/iter077f_sm_rank9_contact_scaling_extension.py'
      - 'results/ITER077C_SM_SOURCE_COLLISION_EXCEPTIONAL_STRATA_RESULT.md'
      - 'results/ITER077D_SM_RANK9_TRUE_B_MAP_SECOND_JET_RESULT.md'
      - 'results/ITER077E_SM_CONTACT_WAVEFRONT_PULLBACK_CRITERION_RESULT.md'
      - '.github/workflows/iter077f_sm_rank9_contact_scaling_extension.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter077F-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter077f_sm_rank9_contact_scaling_extension.py \
            --lane '${{ matrix.lane }}' \
            --output 'out/iter077f_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077f-sm-${{ matrix.lane }}
          path: out/iter077f_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter077F-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter077f-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen contract
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter077f_sm_rank9_contact_scaling_extension.py \
            --aggregate-dir downloaded \
            --output out/iter077f_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077f-sm-aggregate
          path: out/iter077f_sm_aggregate.json
          if-no-files-found: error
