name: Jhalf Appendix-D Distribution Validation

on:
  push:
    branches: [main]
    paths:
      - 'distributional/jhalf_iepsilon_validation.py'
      - '.github/workflows/jhalf-distributional-iepsilon.yml'
  workflow_dispatch:

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rho: ['0.1','0.6','1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q 'mpmath==1.3.0'
      - name: Validate Appendix-D j=1/2 distribution
        run: |
          mkdir -p results
          python distributional/jhalf_iepsilon_validation.py \
            --rho "${{ matrix.rho }}" \
            --output "results/jhalf_distribution_rho${{ matrix.rho }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jhalf-distribution-rho${{ matrix.rho }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
