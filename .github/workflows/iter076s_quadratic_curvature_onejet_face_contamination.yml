name: Iter076S quadratic curvature one-jet face contamination

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076s_quadratic_curvature_onejet_face_contamination.yml'
      - 'distributional/iter076s_quadratic_curvature_onejet_face_contamination.py'
      - 'prereg/ITER076S_QUADRATIC_CURVATURE_ONEJET_FACE_CONTAMINATION.md'

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane ${{ matrix.lane }}
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076s_quadratic_curvature_onejet_face_contamination.py --lane '${{ matrix.lane }}' --output 'out/iter076s_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076s-${{ matrix.lane }}
          path: out/iter076s_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076s-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076s_quadratic_curvature_onejet_face_contamination.py --aggregate-dir downloaded --output out/iter076s_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076s-aggregate
          path: out/iter076s_aggregate.json
          if-no-files-found: error
