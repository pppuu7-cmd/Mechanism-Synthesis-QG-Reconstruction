name: Direct Causal Collision Power Counting

on:
  push:
    branches: [main]
    paths:
      - 'vertex/collision_power_counting.py'
      - 'vertex/direct_causal_integrand_smoke.py'
      - 'vertex/regulated_haar_mc_vertex.py'
      - 'regulated/endpoint_precontraction_scan.py'
      - 'regulated/run_with_stable_hyp2f1.py'
      - '.github/workflows/collision-power-counting.yml'
  workflow_dispatch:

jobs:
  collision-power:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [11,29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Measure full-T and vertex collision powers
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/collision_power_counting.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/collision_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collision-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
