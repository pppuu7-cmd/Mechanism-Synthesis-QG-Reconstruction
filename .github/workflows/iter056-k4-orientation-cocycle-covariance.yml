name: Iter056 K4 Orientation Cocycle Covariance

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_orientation_cocycle_covariance.py'
      - 'status/ITERATION_056.md'
      - '.github/workflows/iter056-k4-orientation-cocycle-covariance.yml'
  workflow_dispatch:

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact oriented denominator and signed-normal covariance audit
        run: |
          mkdir -p results
          python distributional/k4_orientation_cocycle_covariance.py \
            --output results/iter056_orientation_cocycle_covariance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter056-orientation-cocycle-covariance
          path: results/
          if-no-files-found: warn
