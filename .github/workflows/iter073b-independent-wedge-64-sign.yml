name: Iter073B K4 independent-wedge 64-sign atlas
on:
  push:
    paths:
      - '.github/workflows/iter073b-independent-wedge-64-sign.yml'
      - 'distributional/iter073b_independent_wedge_64_sign_atlas.py'
      - 'status/ITERATION_073B_PREREG.md'
  workflow_dispatch:
jobs:
  exact-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy numpy scipy
      - name: Run complete frozen 64-sign atlas
        run: |
          mkdir -p out
          python -m distributional.iter073b_independent_wedge_64_sign_atlas --output out/iter073b-aggregate.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter073b-aggregate
          path: out/iter073b-aggregate.json
          if-no-files-found: error
          retention-days: 90
