name: Direct Causal Ten-Wedge Integrand Smoke

on:
  push:
    branches: [main]
    paths:
      - 'vertex/direct_causal_integrand_smoke.py'
      - 'regulated/general_toller_residue_series.py'
      - 'regulated/j_equal_l_residue_series.py'
      - 'regulated/endpoint_precontraction_scan.py'
      - 'regulated/run_with_stable_hyp2f1.py'
      - '.github/workflows/direct-causal-integrand-smoke.yml'
  workflow_dispatch:

jobs:
  direct-integrand:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','0.5','1.2','2.0']
        seed: [7,23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Run direct ten-wedge causal integrand smoke
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/direct_causal_integrand_smoke.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/direct_integrand_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-integrand-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
