name: Iter078E critic boundary stabilizer control

on:
  push:
    branches: [main]
    paths:
      - 'distributional/iter078e_critic_boundary_stabilizer.py'
      - '.github/workflows/iter078e_critic_boundary_stabilizer.yml'
  workflow_dispatch:

jobs:
  stabilizer:
    strategy:
      fail-fast: false
      matrix:
        p: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational stabilizer control
        run: |
          mkdir -p out
          python distributional/iter078e_critic_boundary_stabilizer.py --p '${{ matrix.p }}' --output 'out/iter078e_critic_stabilizer_p${{ matrix.p }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter078e-critic-stabilizer-p${{ matrix.p }}
          path: out/iter078e_critic_stabilizer_p${{ matrix.p }}.json
          if-no-files-found: error
