name: Iter072B K4 Schwinger signed cutspace theorem
on:
  push:
    paths:
      - '.github/workflows/iter072b-k4-signed-cutspace.yml'
      - 'distributional/iter072b_k4_signed_cutspace_theorem.py'
      - 'distributional/iter072b_aggregate.py'
      - 'status/ITERATION_072B_PREREG.md'
  workflow_dispatch:
jobs:
  exact-lane:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        sigma: ['++++','+++-','++-+','++--','+-++','+-+-','+--+','+---']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy numpy scipy
      - name: Run exact lane
        run: |
          mkdir -p out
          python -m distributional.iter072b_k4_signed_cutspace_theorem --sigma '${{ matrix.sigma }}' --output 'out/iter072b-${{ matrix.sigma }}.json'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter072b-${{ matrix.sigma }}
          path: out/iter072b-${{ matrix.sigma }}.json
          if-no-files-found: error
  aggregate:
    if: always()
    needs: [exact-lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: iter072b-*
          path: artifacts
      - run: python distributional/iter072b_aggregate.py --input-dir artifacts --output iter072b-aggregate.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter072b-aggregate
          path: iter072b-aggregate.json
          if-no-files-found: error
