name: Iter069B K4 Joint Spectral Held-Out Rays

on:
  push:
    branches: [main]
    paths:
      - 'distributional/iter069b_k4_joint_spectral_rays.py'
      - 'status/ITERATION_069B_PREREG.md'
      - '.github/workflows/iter069b-k4-joint-spectral-rays.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case: ['H6','H7']
        tree: ['S0','S1','P0','P1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen held-out radial lane
        run: |
          mkdir -p results
          PYTHONPATH=. python distributional/iter069b_k4_joint_spectral_rays.py \
            --case '${{ matrix.case }}' --tree '${{ matrix.tree }}' \
            --output 'results/iter069b_${{ matrix.case }}_${{ matrix.tree }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter069b-${{ matrix.case }}-${{ matrix.tree }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    runs-on: ubuntu-24.04
    needs: [audit]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter069b-*
          path: gathered
          merge-multiple: true
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json
          from pathlib import Path
          lanes=[json.load(open(f,encoding='utf-8')) for f in sorted(glob.glob('gathered/*.json'))]
          rows=[r for lane in lanes for r in lane.get('rows',[])]
          valid=(len(lanes)==8 and len(rows)==192 and all(l.get('valid') for l in lanes) and all(r.get('valid') for r in rows))
          # Global exact sign-independence at fixed case/tree/direction.
          groups={}
          for r in rows:
              key=(r['case'],r['tree'],r['direction'])
              groups.setdefault(key,set()).add(r['source_leading'])
          sign_independent=(len(groups)==24 and all(len(v)==1 for v in groups.values()))
          passed=valid and sign_independent
          target='ITER069B_K4_JOINT_SPECTRAL_HELDOUT_GENERIC_GROWTH_PLUS6_CAUSAL_SIGN_INDEPENDENT'
          out={'gate':'ITER069B_K4_JOINT_SPECTRAL_HELDOUT_RAYS',
               'frozen_prereg_commit':'cdcbf58d59f9d610b38a1ed1996b54c175fe9897',
               'job_lanes':len(lanes),'exact_cases':len(rows),'all_valid':valid,
               'case_tree_direction_groups':len(groups),'causal_sign_leading_independent':sign_independent,
               'source_degrees':sorted({r['source_net_degree'] for r in rows}),
               'control_degrees':sorted({r['control_net_degree'] for r in rows}),
               'classification':target if passed else 'ITER069B_HELDOUT_ASYMPTOTIC_REVIEW',
               'scope_lock':'Reduced joint-spectral generic-ray asymptotics only; no multivariate boundary-value or causal-vertex divergence theorem.'}
          Path('aggregate').mkdir(exist_ok=True)
          Path('aggregate/iter069b-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not passed: raise SystemExit(9)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter069b-aggregate
          path: aggregate/iter069b-aggregate.json
          if-no-files-found: error
          retention-days: 90
