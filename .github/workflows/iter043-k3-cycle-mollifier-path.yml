name: Iter043C K3 Cycle Mollifier Path

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k3_cycle_mollifier_path_audit.py'
      - '.github/workflows/iter043-k3-cycle-mollifier-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3-cycle-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.1.3'
      - name: Audit cyclic contact-product path dependence
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python distributional/k3_cycle_mollifier_path_audit.py --grid 801 \
            --output results/iter043C_k3_cycle_mollifier.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter043C-k3-cycle-mollifier
          path: results/
          if-no-files-found: error
          retention-days: 30
