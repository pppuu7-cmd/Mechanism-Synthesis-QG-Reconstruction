name: Iter057 K4 Oriented Sign Space Atlas

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_oriented_sign_space_atlas.py'
      - 'status/ITERATION_057.md'
      - '.github/workflows/iter057-k4-oriented-sign-space.yml'
  workflow_dispatch:

jobs:
  exact-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact complete 64-sign oriented atlas
        run: |
          mkdir -p results
          python distributional/k4_oriented_sign_space_atlas.py \
            --output results/iter057_oriented_sign_space_atlas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057-oriented-sign-space-atlas
          path: results/
          if-no-files-found: warn
