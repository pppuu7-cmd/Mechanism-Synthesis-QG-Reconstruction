name: Iter081T-SM finite spectral epsilon K5 L1 diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'prereg/ITER081T_SM_FINITE_SPECTRAL_EPSILON_K5_LOCAL_L1_REGULATOR_TEST.md'
      - 'scripts/iter081t_sm_finite_spectral_epsilon_l1.py'
      - '.github/workflows/iter081t_sm_finite_spectral_epsilon_l1.yml'

permissions:
  contents: read

jobs:
  exact-finite-epsilon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify prospective ordering
        run: |
          git merge-base --is-ancestor 52313c08f39855bf18e3b56fce268e9cd262a074 HEAD
          test "$(git rev-parse 52313c08f39855bf18e3b56fce268e9cd262a074^0)" != "$(git rev-parse HEAD)"
      - name: Run exact finite-epsilon diagnostic
        run: python scripts/iter081t_sm_finite_spectral_epsilon_l1.py
      - name: Upload authoritative aggregate
        uses: actions/upload-artifact@v4
        with:
          name: iter081t-sm-finite-spectral-epsilon
          path: results/raw/iter081t_sm_finite_spectral_epsilon.json
          if-no-files-found: error
          retention-days: 90
