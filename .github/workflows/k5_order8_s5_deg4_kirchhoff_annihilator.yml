name: K5 order8 S5 degree4 Kirchhoff annihilator
on:
  workflow_dispatch:
  push:
    paths:
      - 'prereg/K5_ORDER8_S5_DEG4_KIRCHHOFF_ANNIHILATOR.md'
      - 'scripts/k5_order8_s5_deg4_kirchhoff_annihilator.py'
      - '.github/workflows/k5_order8_s5_deg4_kirchhoff_annihilator.yml'
jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Run frozen exact degree-four gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/k5_order8_s5_deg4_kirchhoff_annihilator.py \
            --output artifacts/k5_order8_s5_deg4_kirchhoff_annihilator.json \
            | tee artifacts/stdout.json
          python - <<'PY'
          import json
          p='artifacts/k5_order8_s5_deg4_kirchhoff_annihilator.json'
          d=json.load(open(p,encoding='utf-8'))
          allowed={
            'K5_S5_DEG4_NONRADIAL_ANNIHILATOR_EXISTS_EXACT_SCOPED',
            'K5_S5_DEG4_NONRADIAL_LOG_NO_ANNIHILATOR_EXACT_SCOPED',
            'K5_S5_DEG4_RADIAL_ONLY_EXACT_SCOPED',
            'K5_S5_DEG4_INCONCLUSIVE_SCOPED',
          }
          assert d['status']=='PASS_EXACT_SCOPED',d
          assert d['classification'] in allowed,d['classification']
          assert all(d['checks'].values()),d['checks']
          assert all(d['controls'].values()),d['controls']
          assert d['orbit_data']['fixed_edge_cubic_orbit_count']>0
          assert d['orbit_data']['s5_invariant_cubic_dimension']>0
          assert d['synthetic_exact']['nonradial_quotient_dimension']>0
          assert d['synthetic_exact']['annihilator_dimension']>0
          assert d['scientific_invariant_dual_period_verdict'] is None
          if d['classification']=='K5_S5_DEG4_NONRADIAL_ANNIHILATOR_EXISTS_EXACT_SCOPED':
              assert d['k5_exact']['nonradial_quotient_dimension']>0
              assert d['k5_exact']['annihilator_dimension']>0
              assert d['k5_exact']['annihilator_logarithmic_quotient_zero'] is True
          print('CLASSIFICATION=',d['classification'])
          print('K5=',d['k5_exact'])
          print('SYNTHETIC=',d['synthetic_exact'])
          PY
          sha256sum artifacts/k5_order8_s5_deg4_kirchhoff_annihilator.json | tee artifacts/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-order8-s5-deg4-kirchhoff-annihilator
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
