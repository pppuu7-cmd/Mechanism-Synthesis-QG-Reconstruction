name: Iter076F K4 cut-cycle S4 intertwiner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076f_k4_cut_cycle_s4_intertwiner.yml'
  workflow_dispatch:

jobs:
  intertwiner:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen lane ${{ matrix.lane }}
        run: |
          mkdir -p out
          python distributional/iter076f_k4_cut_cycle_s4_intertwiner.py --lane '${{ matrix.lane }}' --output 'out/iter076f_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076f-${{ matrix.lane }}
          path: out/iter076f_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: intertwiner
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076f-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        run: |
          mkdir -p out
          python distributional/iter076f_aggregate.py --input-root downloaded --output out/iter076f_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076f-aggregate
          path: out/iter076f_aggregate.json
          if-no-files-found: error
