name: Critic K4 order3 source-object reachability
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/critic_k4_order3_reachability.py'
      - '.github/workflows/critic-k4-order3-reachability.yml'
permissions:
  contents: read
jobs:
  critic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prospective ordering
        shell: bash
        run: |
          set -euo pipefail
          P=$(git log --format=%H -- prereg/ACTUAL_MULTIVARIATE_K4_ORDER3_OBJECT_DEFINITION_REACHABILITY_INDEPENDENT_CRITIC_REVIEW.md | tail -1)
          I=$(git log --format=%H -- scripts/critic_k4_order3_reachability.py | tail -1)
          test -n "$P" && test -n "$I"
          git merge-base --is-ancestor "$P" "$I"
          test "$P" != "$I"
          echo "prereg=$P implementation=$I"
      - name: Run independent critic
        run: python scripts/critic_k4_order3_reachability.py
      - name: Hash production JSON
        if: always()
        run: sha256sum results/raw/critic_k4_order3_reachability.json || true
      - name: Upload critic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critic-k4-order3-reachability
          path: results/raw/critic_k4_order3_reachability.json
          if-no-files-found: error
