name: Iter037 Oriented Simplex Symmetry

on:
  push:
    branches: [main]
    paths:
      - 'regulated/k5_oriented_a5_symmetry_exact.py'
      - 'vertex/toller_orientation_reversal_identity.py'
      - '.github/workflows/iter037-oriented-simplex-symmetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-a5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact A5 oriented-simplex symmetry audit
        run: |
          mkdir -p results
          python regulated/k5_oriented_a5_symmetry_exact.py --output results/iter037_a5_exact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter037-a5-exact
          path: results/
          if-no-files-found: error
          retention-days: 30

  toller-reversal:
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [73,131]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'mpmath==1.3.0' 'sympy==1.14.0' 'numpy==2.1.3'
      - name: Discover on training and verify on holdout the orientation-reversal law
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/toller_orientation_reversal_identity.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/iter037_reversal_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter037-reversal-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          if-no-files-found: error
          retention-days: 30
