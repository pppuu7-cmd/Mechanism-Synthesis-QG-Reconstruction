name: Iter077G-SM corrected jhalf contact microlocal scaling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'status/ITER077_CONTACT_FORMULA_ERRATUM.md'
      - 'sources/CAUSAL_SPINFOAM_VERTEX_2026_CONTACT_EQ37_39_CORRECTED_SNAPSHOT.md'
      - 'prereg/ITER077G_SM_CORRECTED_JHALF_CONTACT_MICROLOCAL_SCALING.md'
      - 'distributional/iter077g_sm_corrected_jhalf_contact_microlocal_scaling.py'
      - 'results/ITER077A_TRUE_SOURCE_B_MAP_TRANSVERSALITY_RESULT.md'
      - 'results/ITER077C_SM_SOURCE_COLLISION_EXCEPTIONAL_STRATA_RESULT.md'
      - 'results/ITER077D_SM_RANK9_TRUE_B_MAP_SECOND_JET_RESULT.md'
      - '.github/workflows/iter077g_sm_corrected_jhalf_contact_microlocal_scaling.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Iter077G-SM lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen corrected lane
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter077g_sm_corrected_jhalf_contact_microlocal_scaling.py \
            --lane '${{ matrix.lane }}' \
            --output 'out/iter077g_sm_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077g-sm-${{ matrix.lane }}
          path: out/iter077g_sm_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate Iter077G-SM
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter077g-sm-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate frozen corrected contract
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter077g_sm_corrected_jhalf_contact_microlocal_scaling.py \
            --aggregate-dir downloaded \
            --output out/iter077g_sm_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter077g-sm-aggregate
          path: out/iter077g_sm_aggregate.json
          if-no-files-found: error
