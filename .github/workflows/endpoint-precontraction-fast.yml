name: Fast Toller Precontraction Diagnostics

on:
  push:
    branches: [main]
    paths:
      - "regulated/endpoint_precontraction_fast.py"
      - "regulated/run_with_stable_hyp2f1.py"
      - ".github/workflows/endpoint-precontraction-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-heavy-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        mode: [precontracted, cutoff-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'mpmath==1.3.0' sympy
      - name: Run cached ${{ matrix.mode }} diagnostic
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py \
            regulated/endpoint_precontraction_fast.py \
            --mode "${{ matrix.mode }}" \
            --output "results/endpoint_fast_${{ matrix.mode }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-fast-${{ matrix.mode }}
          path: results/
          if-no-files-found: error
          retention-days: 30
