name: K5 34-orbit pre-Wick product composition defect diagnostic
on:
  push:
    paths:
      - 'scripts/k5_34_orbit_prewick_product_composition_defect_diagnostic.py'
      - '.github/workflows/k5_34_orbit_prewick_product_composition_defect_diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen exact diagnostic
        run: python scripts/k5_34_orbit_prewick_product_composition_defect_diagnostic.py --output results/raw/k5_34_orbit_prewick_product_composition_defect_diagnostic.json
      - name: Upload terminal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-34-orbit-prewick-product-composition-defect-diagnostic
          path: results/raw/k5_34_orbit_prewick_product_composition_defect_diagnostic.json
          if-no-files-found: warn
