name: Iter043A Jhalf Finite Epsilon Contact

on:
  push:
    branches: [main]
    paths:
      - 'distributional/jhalf_finite_epsilon_contact.py'
      - '.github/workflows/iter043-jhalf-finite-epsilon-contact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-epsilon-contact:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        gamma: ['0.2','1.2','2.0']
        epsilon: ['0.4','0.2','0.1','0.05']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'mpmath==1.3.0'
      - name: Validate exact finite-epsilon contact identity
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python distributional/jhalf_finite_epsilon_contact.py \
            --gamma '${{ matrix.gamma }}' --epsilon '${{ matrix.epsilon }}' \
            --output 'results/iter043A_g${{ matrix.gamma }}_e${{ matrix.epsilon }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter043A-g${{ matrix.gamma }}-e${{ matrix.epsilon }}
          path: results/
          if-no-files-found: error
          retention-days: 30
