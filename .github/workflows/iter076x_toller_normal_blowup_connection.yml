name: Iter076X Toller normal blow-up connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076x_toller_normal_blowup_connection.yml'
      - 'distributional/iter076x_toller_normal_blowup_connection.py'
      - 'prereg/ITER076X_TOLLER_NORMAL_BLOWUP_CONNECTION.md'
      - 'sources/TOLLER_NORMAL_BLOWUP_CONNECTION_SUPPLEMENT.md'
      - 'results/ITER076W_COMPACT_NODE_GAUGE_PURE_DIRECTION_CLOSURE_RESULT.md'

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen lane ${{ matrix.lane }}
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076x_toller_normal_blowup_connection.py --lane '${{ matrix.lane }}' --output 'out/iter076x_${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter076x-${{ matrix.lane }}
          path: out/iter076x_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter076x-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        env:
          PYTHONPATH: .
        run: |
          mkdir -p out
          python distributional/iter076x_toller_normal_blowup_connection.py --aggregate-dir downloaded --output out/iter076x_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter076x-aggregate
          path: out/iter076x_aggregate.json
          if-no-files-found: error
