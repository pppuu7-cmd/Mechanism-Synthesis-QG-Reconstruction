name: Iter059 Toller Wedge Reversal Law

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/iter059_toller_wedge_reversal.py'
      - '.github/workflows/iter059-toller-wedge-reversal.yml'
      - 'status/ITERATION_059.md'
  workflow_dispatch:

jobs:
  exact-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact/numerical dependencies
        run: python -m pip install -q 'sympy==1.14.0' 'mpmath==1.3.0'
      - name: Run frozen Iter059 exact source-backed audit
        run: python scripts/iter059_toller_wedge_reversal.py | tee iter059_stdout.txt
      - name: Record provenance
        if: always()
        run: |
          printf 'head_sha=%s\n' "$GITHUB_SHA" > iter059_provenance.txt
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> iter059_provenance.txt
          printf 'prereg_commit=%s\n' 'd8e1ed549f1810cbf61da78f4cf881d83c745ade' >> iter059_provenance.txt
          printf 'implementation_commit=%s\n' '0b13c1e0efd1b6256204c465ac4738c8ba2dcd1b' >> iter059_provenance.txt
      - name: Upload raw Iter059 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter059-toller-wedge-reversal
          path: |
            iter059_toller_wedge_reversal.json
            iter059_stdout.txt
            iter059_provenance.txt
          if-no-files-found: warn
