name: K5 34-orbit physical numerator action-flux audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/k5_34_orbit_physical_numerator_action_flux_audit.py'
      - 'scripts/k5_34_orbit_physical_numerator_action_flux_audit_repair2.py'
      - '.github/workflows/k5_34_orbit_physical_numerator_action_flux_audit.yml'
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run exact 34-orbit audit repair3
        run: |
          set -euo pipefail
          mkdir -p artifacts/k5_34_orbit_action_flux
          python scripts/k5_34_orbit_physical_numerator_action_flux_audit_repair2.py \
            --output artifacts/k5_34_orbit_action_flux/result.json \
            | tee artifacts/k5_34_orbit_action_flux/stdout.txt
      - name: Validate outcome-neutral payload
        run: |
          python - <<'PY'
          import json
          p='artifacts/k5_34_orbit_action_flux/result.json'
          d=json.load(open(p))
          allowed={
            'K5_34_ORBIT_PHYSICAL_NUMERATOR_ACTION_FLUX_AUDIT_EXACT_SCOPED',
            'K5_34_ORBIT_PHYSICAL_NUMERATOR_ACTION_FLUX_PARTIAL_BLOCKED_SCOPED',
          }
          assert d['classification'] in allowed,d['classification']
          assert len(d['orbit_rows'])==34
          assert sum(1 for r in d['orbit_rows'] if r['physical'])==32
          assert d['summary']['certified_channel_orbit_components']+d['summary']['blocked_channel_orbit_components']==64
          assert all(d['repair3_checks'].values()),d['repair3_checks']
          assert d['global_stokes_ibp_verdict'] is None
          assert d['integrated_period_verdict'] is None
          assert d['finite_part_selector'] is None
          assert d['regulator_independence'] is None
          print('CLASSIFICATION=',d['classification'])
          print('SUMMARY=',d['summary'])
          print('REPAIR3_CHECKS=',d['repair3_checks'])
          PY
          sha256sum artifacts/k5_34_orbit_action_flux/result.json | tee artifacts/k5_34_orbit_action_flux/result_sha256.txt
      - name: Upload exact audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-34-orbit-physical-numerator-action-flux-audit
          path: artifacts/k5_34_orbit_action_flux/
          retention-days: 90