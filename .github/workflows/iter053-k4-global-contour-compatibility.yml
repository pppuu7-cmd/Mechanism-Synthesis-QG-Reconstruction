name: Iter053 K4 Global Contour Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'distributional/k4_global_contour_compatibility.py'
      - 'status/ITERATION_052_RESULT.md'
      - 'status/ITERATION_053.md'
      - '.github/workflows/iter053-k4-global-contour-compatibility.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        sign_class: ['+++','++-','+-+','+--','-++','-+-','--+','---']
        tree: ['S0','S1','P0','P1']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - name: Exact common-translation compatibility lane
        env:
          SIGN_CLASS: ${{ matrix.sign_class }}
          TREE: ${{ matrix.tree }}
        run: |
          mkdir -p results
          python distributional/k4_global_contour_compatibility.py \
            --mode compute --sign-class="$SIGN_CLASS" --tree "$TREE" \
            --output "results/iter053_${SIGN_CLASS}_${TREE}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter053-${{ matrix.sign_class }}-${{ matrix.tree }}
          path: results/
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'sympy==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter053-*
          path: collected
          merge-multiple: true
      - name: Aggregate frozen Iter053 gate
        run: |
          mkdir -p results
          python distributional/k4_global_contour_compatibility.py \
            --mode aggregate --input-dir collected \
            --output results/iter053_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter053-aggregate
          path: results/
          if-no-files-found: warn
