name: Leading Pole Subtraction Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'vertex/leading_pole_subtraction.py'
      - '.github/workflows/leading-pole-subtraction.yml'
  workflow_dispatch:

jobs:
  pole-subtraction:
    strategy:
      fail-fast: false
      matrix:
        gamma: ['0.2','1.2','2.0']
        seed: [11,29]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Measure leading-pole subtraction remainder
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/leading_pole_subtraction.py \
            --gamma "${{ matrix.gamma }}" \
            --seed "${{ matrix.seed }}" \
            --output "results/subtraction_g${{ matrix.gamma }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: subtraction-g${{ matrix.gamma }}-s${{ matrix.seed }}
          path: results/
          retention-days: 30
