name: General-j Appendix-D Distribution Validation

on:
  push:
    branches: [main]
    paths:
      - 'distributional/general_j_appendix_d_validation.py'
      - '.github/workflows/general-j-appendix-d.yml'
  workflow_dispatch:

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rho: ['0.1','0.6','1.0']
        j2: [2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q 'mpmath==1.3.0'
      - name: Validate general-j Appendix-D distribution
        run: |
          mkdir -p results
          python distributional/general_j_appendix_d_validation.py \
            --rho "${{ matrix.rho }}" \
            --j2 "${{ matrix.j2 }}" \
            --output "results/general_j_rho${{ matrix.rho }}_j2${{ matrix.j2 }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-j-rho${{ matrix.rho }}-j2${{ matrix.j2 }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
