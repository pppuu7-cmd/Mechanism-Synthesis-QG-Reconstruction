name: Pair Exclusion Epsilon Scan

on:
  push:
    branches: [main]
    paths:
      - 'vertex/pair_exclusion_mc.py'
      - '.github/workflows/pair-exclusion-scan.yml'
  workflow_dispatch:

jobs:
  exclusion-scan:
    strategy:
      fail-fast: false
      matrix:
        mode: [allplus, onefour, twothree, eprl]
        seed: [301, 607]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -q 'mpmath==1.3.0' sympy numpy
      - name: Run nested exclusion scan
        env:
          PYTHONPATH: .
        run: |
          mkdir -p results
          python regulated/run_with_stable_hyp2f1.py vertex/pair_exclusion_mc.py \
            --gamma 1.2 \
            --mode "${{ matrix.mode }}" \
            --cutoff 1.0 \
            --samples 512 \
            --seed "${{ matrix.seed }}" \
            --output "results/exclusion_${{ matrix.mode }}_s${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: exclusion-${{ matrix.mode }}-s${{ matrix.seed }}
          path: results/
          retention-days: 30
