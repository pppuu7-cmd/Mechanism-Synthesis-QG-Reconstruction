name: K5 degree4 projective constant2x2 closure
on:
  workflow_dispatch:
  push:
    paths:
      - 'prereg/K5_DEG4_ANNIHILATOR_PROJECTIVE_CONSTANT2X2_CLOSURE.md'
      - 'sources/raw/k5_deg4_projective_closure_parent_point_lock.json'
      - 'scripts/k5_deg4_projective_constant2x2_closure.py'
      - '.github/workflows/k5_deg4_projective_constant2x2_closure.yml'
jobs:
  exact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact projective closure gate
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/k5_deg4_projective_constant2x2_closure.py --output artifacts/k5_deg4_projective_constant2x2_closure.json | tee artifacts/stdout.txt
          python3 - <<'PY'
          import json
          p='artifacts/k5_deg4_projective_constant2x2_closure.json'
          d=json.load(open(p))
          allowed={
            'K5_PROJECTIVE_CONSTANT2X2_CLOSURE_CONFIRMED_ON_FROZEN_POINTS_EXACT_SCOPED',
            'K5_PROJECTIVE_CONSTANT2X2_CLOSURE_FALSIFIED_EXACT_SCOPED',
            'K5_PROJECTIVE_CONSTANT2X2_CLOSURE_BLOCKED_FIT_DEGENERACY_SCOPED',
          }
          assert d['status']=='PASS_EXACT_SCOPED',d
          assert d['classification'] in allowed,d
          assert all(d['checks'].values()),d['checks']
          assert all(d['controls'].values()),d['controls']
          assert d['scientific_invariant_dual_period_verdict'] is None
          assert d['exact']['residuals']['fit_A']==['0','0'] if not d['exact']['fit_degenerate'] else True
          assert d['exact']['residuals']['fit_B']==['0','0'] if not d['exact']['fit_degenerate'] else True
          print('CLASSIFICATION=',d['classification'])
          print('VALIDATION_NONZERO_RESIDUAL_COUNT=',d['exact']['validation_nonzero_residual_count'])
          print('M=',d['exact']['constant_2x2_fit_matrix'])
          print('VALIDATION_U=',d['exact']['residuals'].get('validation_U'))
          print('VALIDATION_G=',d['exact']['residuals'].get('validation_G'))
          PY
          sha256sum artifacts/k5_deg4_projective_constant2x2_closure.json | tee artifacts/result_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-deg4-projective-constant2x2-closure
          path: artifacts/
          retention-days: 90
