name: Iter076A Transitive overlap Mobius bookkeeping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter076a-transitive-overlap-mobius.yml'
      - 'distributional/iter076a_transitive_overlap_mobius.py'
  workflow_dispatch:

jobs:
  exact-overlap-poset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Run frozen Iter076A exact audit
        run: |
          mkdir -p artifacts/iter076a
          python distributional/iter076a_transitive_overlap_mobius.py --output artifacts/iter076a/result.json
      - name: Upload frozen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter076a-transitive-overlap-mobius
          path: artifacts/iter076a/result.json
          if-no-files-found: error
