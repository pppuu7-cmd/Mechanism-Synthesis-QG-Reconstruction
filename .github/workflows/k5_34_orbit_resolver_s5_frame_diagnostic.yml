name: K5 34-orbit resolver S5 frame diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k5_34_orbit_resolver_s5_frame_diagnostic.yml'
      - 'scripts/k5_34_orbit_resolver_s5_frame_diagnostic.py'
      - 'scripts/k5_34_orbit_exact_leading_coefficient_core_repair1.py'
      - 'prereg/K5_34_ORBIT_RESOLVER_REPAIR1_S5_FRAME_DIAGNOSTIC.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact S5 label-frame diagnostic
        run: |
          python scripts/k5_34_orbit_resolver_s5_frame_diagnostic.py \
            --output results/raw/k5_34_orbit_resolver_s5_frame_diagnostic_production.json
      - name: Validate frozen diagnostic surface
        run: |
          python - <<'PY'
          import json
          p='results/raw/k5_34_orbit_resolver_s5_frame_diagnostic_production.json'
          r=json.load(open(p, encoding='utf-8'))
          allowed={
            'K5_34_ORBIT_RESOLVER_S5_LABEL_FRAME_MISMATCH_CONFIRMED_EXACT_CONTROL',
            'K5_34_ORBIT_RESOLVER_S5_LABEL_FRAME_HYPOTHESIS_NOT_CONFIRMED_EXACT_CONTROL',
            'INVALID_IMPLEMENTATION',
          }
          assert r['classification'] in allowed
          assert r['scientific_coefficient_verdict'] is None
          assert r['no_N_B_orders_or_coefficients_recorded'] is True
          assert r['prereg_commit']=='fb648ab3b5c5430840c8025ceb31500252c080cc'
          print('FINAL_CLASSIFICATION='+r['classification'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-34-orbit-resolver-s5-frame-diagnostic
          path: results/raw/k5_34_orbit_resolver_s5_frame_diagnostic_production.json
          if-no-files-found: error
          retention-days: 90
